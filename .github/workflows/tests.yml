name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      # requirements.txt pins pytest alongside ephem and numpy, so this is the lot.
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m pytest tools/ -q
